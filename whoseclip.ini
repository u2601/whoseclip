; WhoseClip configuration. Place next to whoseclip.exe.
; Everything here can also be given on the command line, which wins over the file.
; This file is the ONLY thing WhoseClip ever writes to disk. Clipboard content is
; never written anywhere.

[whoseclip]
; Machine name shown in the tray tooltip and strip. Defaults to the computer name.
label=

; Colours as RRGGBB. local = copied on this machine, foreign = arrived from
; another machine (VMware Tools, RDP, VirtualBox), idle = clipboard empty/paused.
colorLocal=3B9EFF
colorForeign=FF9A3B
colorIdle=6E6E78

; Strip appearance
colorBg=181820
colorFg=EBEBF0
colorDim=9696A0

; 1 = strip visible at startup, 0 = tray only
showStrip=1

; 1 = strip starts expanded (whole preview, wrapped), 0 = two-line strip.
; Also toggled by the chevron button on the strip, double-clicking it, or the
; tray menu. The close button on the strip sets showStrip=0.
expanded=0

; Strip position; -2147483648 means auto (top-right of the work area)
stripX=-2147483648
stripY=-2147483648

; Characters of preview to keep in memory. The expanded strip shows as much of
; this as fits; the collapsed strip shows one flattened line.
previewChars=1500

; Extra process names to treat as cross-machine relays, comma separated.
; The built-in list already covers vmtoolsd.exe, vmware-vmx.exe, vmware.exe,
; rdpclip.exe, VBoxTray.exe, vmware-view.exe and a few others.
extraExternals=
